version: '3.8'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: deltafunc
    ports:
    - 5432:5432
    volumes:
    - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:alpine
    ports:
    - 6379:6379
    volumes:
    - redis_data:/data
  qdrant:
    image: qdrant/qdrant:latest
    ports:
    - 6333:6333
    volumes:
    - qdrant_data:/qdrant/storage
  clickhouse:
    image: clickhouse/clickhouse-server
    ports:
    - 8123:8123
    - 9000:9000
    volumes:
    - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
  offer_analyzer:
    build:
      context: .
      dockerfile: services/offer_analyzer/Dockerfile
    env_file:
    - .env
    ports:
    - 8000:8000
    depends_on:
    - postgres
    - redis
  traffic_router:
    build:
      context: .
      dockerfile: services/traffic_router/Dockerfile
    env_file:
    - .env
    ports:
    - 8001:8001
  manager_assistant:
    build:
      context: .
      dockerfile: services/manager_assistant/Dockerfile
    env_file:
    - .env
    ports:
    - 8002:8002
    depends_on:
    - qdrant
volumes:
  postgres_data: null
  redis_data: null
  qdrant_data: null
  clickhouse_data: null
